<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Web CLI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="layout">
      <header>
        <div class="title">codex</div>
        <div class="sep">›</div>
        <div class="title">web cli</div>
        <div class="status">
          <span id="status-model" class="pill" title="Model in use">model: ?</span>
          <span id="status-session" class="pill" title="Current session id">session: –</span>
          <span id="status-tokens" class="pill" title="Token usage">tokens: 0</span>
            <span id="status-exec" class="pill" title="Command status">exec: idle</span>
            <span id="status-patch" class="pill" title="Patch apply status">patch: idle</span>
            <label class="pill" title="Enable writes" style="display:inline-flex;align-items:center;gap:8px;">
              <input id="write-enable" type="checkbox" style="margin:0;" />
              <span style="font-size:12px;color:var(--muted)">write</span>
            </label>
        </div>
      </header>

      <aside class="sidebar">
        <div class="toolbar">
          <button id="open-chats" class="btn" title="Open chats">💬 Chats</button>
          <input id="file-search" type="text" placeholder="Search files…" />
          <button id="refresh-files" class="btn" title="Refresh">↻</button>
        </div>
        <div class="pathbar">
          <button id="up-dir" class="btn" title="Go up">↑</button>
          <input id="current-path" type="text" readonly />
          <button id="set-cwd" class="btn" title="Set working directory">Set CWD</button>
        </div>
        <div id="file-list" class="list" aria-label="Files"></div>
      </aside>

      <main class="main">
        <div id="term" class="terminal" aria-live="polite" aria-label="Codex output"></div>
        <div class="input-bar">
          <div class="prompt-label">codex›</div>
          <div class="input-box">
            <textarea id="prompt" placeholder="Type a prompt. Paste images or use the picker below. Shift+Enter for newline; Enter to run."></textarea>
            <div id="attachments" class="attachments" aria-label="Attached images" hidden></div>
            <div class="controls">
              <label class="toggle"><input id="full-auto" type="checkbox" /> Full auto (no approvals)</label>
              <label class="toggle"><input id="show-reasoning" type="checkbox" checked /> reasoning</label>
              <label class="toggle">cwd: <input id="cwd" type="text" size="36" placeholder="inherit server working dir" /></label>
              <label class="toggle">images: <input id="images" type="file" accept="image/*" multiple /></label>
              <button id="run" class="btn">Run (Enter)</button>
              <button id="cancel" class="btn secondary" disabled>Cancel</button>
              <button id="compact" class="btn secondary" disabled>Compact</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Chats modal -->
    <div id="chats-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="chats-title">
      <div class="modal-content">
        <div class="modal-header">
          <div id="chats-title" class="modal-title">Conversations</div>
          <button id="close-chats" class="btn secondary">Close</button>
        </div>
        <div class="toolbar">
          <input id="search-conv" type="text" placeholder="Search conversations…" />
          <button id="refresh-conv" class="btn" title="Refresh">↻</button>
        </div>
        <div id="conv-list" class="list" aria-label="Conversations"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
  </html>
